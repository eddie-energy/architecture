link adminConsole to database--><g id="link_adminConsole_database"><path d="M439,178.26 C439,206.3 439,245.06 439,273.81 " fill="none" id="adminConsole-database" style="stroke:#181818;stroke-width:1.0;"/></g><rect fill="none" height="16.2969" id="_caption" style="stroke:none;stroke-width:1.0;" width="301" x="114" y="398"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="301" x="114" y="410.9951">Deployment Diagram: Level 2 view, option 2</text><!--MD5=[df8405d6101204705106f492f509ac3d]
@startuml deployment-diagram-option-2
'deployment diagram
caption Deployment Diagram: Level 2 view, option 2

skinparam linetype ortho
skinparam interface {
  backgroundColor transparent
  borderColor black
}
skinparam artifact{
  BorderColor black
  BackgroundColor transparent
}
skinparam component{
  BorderColor black
  BackgroundColor transparent
}
skinparam actor{
  BorderColor black
  BackgroundColor transparent
}
skinparam database{
  BorderColor black
  BackgroundColor transparent
}

rectangle "EDDIE Framework" {
  node "Docker Runtime" <<Local Computing Infrastructure>> as local {    
    artifact "Permission\nFacade" <<Container>> as consentFacade
    component "Interoperable\nCommunication" as comm
    artifact "Admin\nConsole" <<Container>> as adminConsole
  }
  node "Docker Runtime" <<Corporate Computing Infrastructure>> as org {
    artifact "Streaming\nInfrastructure" <<Container>> as broker
    database "\tDatabase\t\n" <<Container>> as database
  }
}
  consentFacade -right- comm
  adminConsole -left- comm
  comm -down- broker
  comm -down- database
  adminConsole -down- database 

@enduml

