3">send(data)</text><polygon fill="#181818" points="399,468.2891,389,472.2891,399,476.2891" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="393" x2="522" y1="472.2891" y2="472.2891"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="18" x="405" y="467.2231">11</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="70" x="427" y="467.2231">send(data)</text><polygon fill="#181818" points="615.5,497.4219,625.5,501.4219,615.5,505.4219" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="388" x2="621.5" y1="501.4219" y2="501.4219"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="18" x="395" y="496.356">12</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="70" x="417" y="496.356">send(data)</text><rect fill="none" height="16.2969" id="_caption" style="stroke:none;stroke-width:1.0;" width="652" x="129" y="530.4219"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="652" x="129" y="543.417">Sequence Diagram: The Regional Connector of Austria gets the historical data of the customer</text><!--MD5=[1f731369146fe5b8221978f23be80f22]
@startuml get-historical-data-austria
'sequence diagram
caption Sequence Diagram: The Regional Connector of Austria gets the historical data of the customer

skinparam style strictuml
skinparam sequence {
  ParticipantBackgroundColor transparent
  ActorBackgroundColor transparent
}

autonumber
!pragma teoz true

actor "Customer" as user
box "EDDIE Framework" #transparent
  ' participant "Permission\nFacade" as website
  box "Interoperable Communication\n"  #transparent
    box "Regional Connector - Austria"  #transparent
      participant "Microfrontend" as microfrontend
      participant "Translation\nService" as translationService
      participant "Ponton\nAdapter" as pontonAdapter
      participant "Ponton XP\nMessenger" as pontonXP
    end box
      participant "Message\nProducer" as messageProducer
  end box
end box
box "Regional Data-sharing\nInfrastructure" #transparent
  box "EDA" #transparent
    participant "Consent\nAdmin Portal" as adminPortal
  end box
  box "DSO" #transparent
    participant "Meter Data\nPortal" as dataPortal
  end box
end box

microfrontend -> user : show(redirection)
user -> adminPortal : login(credentials)
user -> adminPortal : approve(consentRequest)
activate adminPortal
adminPortal -> pontonXP : CCM approved
deactivate adminPortal
activate pontonXP
pontonXP -> pontonAdapter : CCM approved
deactivate pontonXP
activate pontonAdapter
pontonAdapter -> microfrontend : CCM approved
deactivate pontonAdapter
activate microfrontend
microfrontend -> user : show(\nconsentStatus)
deactivate microfrontend

adminPortal -> dataPortal : get(data)
activate dataPortal
  dataPortal - ->> adminPortal : data
deactivate dataPortal
adminPortal -> pontonXP : send(data)

pontonXP -> pontonAdapter : send(data)
pontonAdapter -> messageProducer : send(data)



@enduml

