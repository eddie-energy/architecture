link database to adminconsole--><g id="link_database_adminconsole"><path d="M229.35,121 C240.56,121 252.71,121 264.17,121 " fill="none" id="database-adminconsole" style="stroke:#181818;stroke-width:1.0;"/></g><rect fill="none" height="16.2969" id="_caption" style="stroke:none;stroke-width:1.0;" width="367" x="43" y="356"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="367" x="43" y="368.9951">Component Diagram: High-level view of the Database</text><!--MD5=[755162ed835ae48df12bfad242f2cb33]
@startuml database
'component diagram
caption Component Diagram: High-level view of the Database

skinparam linetype ortho
skinparam interface {
  backgroundColor transparent
  borderColor black
}
skinparam component{
  BorderColor black
  BackgroundColor transparent
}
skinparam collections{
  BorderColor black
  BackgroundColor white
}
skinparam database{
  BorderColor black
  BackgroundColor transparent
}
skinparam rectangle{
  BorderColor transparent
  BackgroundColor transparent
  FontColor transparent
}
' component "Service/Data\nMarketplace" as marketplace
node "Eligible Party Infrastructure"  as epInfra{
  component "EDDIE Framework" as eddie {
    component "Interoperable Communication" as comm {
      collections "Regional Connector\n" as regCon
      component "AIIDA\nConnector" as regConAIIDA
    }
    database "Database\n" as database
    component "Admin\nConsole" as adminconsole

    database -down- regCon
    database -down- regConAIIDA
    database -right- adminconsole
  }

}








@enduml

