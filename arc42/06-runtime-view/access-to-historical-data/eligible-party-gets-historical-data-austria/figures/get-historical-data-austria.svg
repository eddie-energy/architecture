engthAdjust="spacing" textLength="18" x="551" y="628.7192">15</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="36" x="573" y="621.1528">send(</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="93" x="573" y="636.2856">historicalData)</text><polygon fill="#181818" points="308,666.4844,298,670.4844,308,674.4844" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="302" x2="533" y1="670.4844" y2="670.4844"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="18" x="314" y="665.4185">16</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129" x="336" y="665.4185">send(historicalData)</text><!--MD5=[7b44857fa11ba881da826b298a8284f0]
@startuml get-historical-data-austria
'sequence diagram
caption Sequence Diagram: The consumer gives consent to an eligible party for access to historical data.

skinparam style strictuml
skinparam sequence {
  ParticipantBackgroundColor transparent
  ActorBackgroundColor transparent
}

autonumber

actor "Consumer" as user
participant "EP\nWebsite" as website
box "EDDIE Framework" #transparent
  participant "Consent\nFacade" as facade
  participant "Interoperable\nCommunication" as comm
  participant "Consent\nFacade" as facade
end box
box "EDA" #transparent
participant "Consent\nAdmin Portal" as adminPortal
end box
box "DSO" #transparent
participant "Meter Data\nPortal" as dataPortal
end box

user -> website : login()
user -> website : connectMyData()
activate website
  website -> facade : getConsentPortals()
    activate facade
    facade - ->> website : countries,\nadminPortals
  deactivate facade
  website - ->> user : show(countries,\nadminPortals)
deactivate website

user -> website : select(admin\nPortal)
activate website
  website -> facade : forward(adminPortal)
  activate facade
    facade -> comm : get\nConsent(\nconsumer)
    comm -> adminPortal : requestConsent(consumer, EP)
    adminPortal -> dataPortal : forward(\nconsentRequest)
    facade - ->> website : OK
  deactivate facade
  website - ->> user : redirectTo(\ndataPortal)
deactivate website

user -> dataPortal : login()
user -> dataPortal : acceptConsentRequest()
dataPortal -> adminPortal : send(\nhistoricalData)
adminPortal -> comm : send(historicalData)

@enduml

