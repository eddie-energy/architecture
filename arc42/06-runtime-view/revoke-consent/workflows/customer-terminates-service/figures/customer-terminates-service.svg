;" x1="208" x2="218" y1="515.6875" y2="519.6875"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="207" x2="355" y1="515.6875" y2="515.6875"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="9" x="224" y="510.6216">9</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="93" x="237" y="510.6216">consentStatus</text><line style="stroke:#181818;stroke-width:1.0;" x1="43" x2="53" y1="544.8203" y2="540.8203"/><line style="stroke:#181818;stroke-width:1.0;" x1="43" x2="53" y1="544.8203" y2="548.8203"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="42" x2="196" y1="544.8203" y2="544.8203"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="18" x="59" y="539.7544">10</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="93" x="81" y="539.7544">consentStatus</text><rect fill="none" height="16.2969" id="_caption" style="stroke:none;stroke-width:1.0;" width="382" x="234.5" y="573.8203"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="382" x="234.5" y="586.8154">Sequence Diagram: The customer terminates a Service</text><!--MD5=[86588c50ac4b0eb6df18cd3e76e06735]
@startuml customer-terminates-service
'sequence diagram
caption Sequence Diagram: The customer terminates a Service

skinparam style strictuml
skinparam sequence {
  ParticipantBackgroundColor transparent
  ActorBackgroundColor transparent
}

autonumber
!pragma teoz true

actor "Customer" as user
box "Eligible Party Infrastructure" #transparent
  box "EDDIE Framework\n" #transparent
    participant "Permission\nFacade" as consentFacade
    box "Interoperable\nCommunication" #transparent
      participant "Regional\nConnector" as regionalConnector
    end box
  end box
  participant "Service" as service
end box
box "Regional Data-sharing\nInfrastructure" #transparent
  participant "Consent\nAdmin Portal" as adminPortal
end box

user -> consentFacade : login(credentials)
user -> consentFacade : terminate(service)
activate consentFacade
  consentFacade -> regionalConnector : terminate(service,\ncustomer)
    activate regionalConnector
      regionalConnector -> regionalConnector : terminate(service,\ncustomer)
      regionalConnector -> service : inform(termination,\ncustomer)
      regionalConnector -> adminPortal : revokeConsent(\ncustomer)
      activate adminPortal
        adminPortal -> adminPortal : revokeConsent(\ncustomer, eligibleParty)
        adminPortal - ->> regionalConnector : consentStatus
      deactivate adminPortal
      regionalConnector - ->> consentFacade : consentStatus
    deactivate regionalConnector
  consentFacade - ->> user : consentStatus
deactivate consentFacade


@end

