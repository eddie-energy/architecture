ght="bold" lengthAdjust="spacing" textLength="9" x="112" y="189.3247">2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187" x="125" y="189.3247">inform(revocation, customer)</text><line style="stroke:#181818;stroke-width:1.0;" x1="329" x2="371" y1="223.5234" y2="223.5234"/><line style="stroke:#181818;stroke-width:1.0;" x1="371" x2="371" y1="223.5234" y2="236.5234"/><line style="stroke:#181818;stroke-width:1.0;" x1="330" x2="371" y1="236.5234" y2="236.5234"/><polygon fill="#181818" points="340,232.5234,330,236.5234,340,240.5234" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="9" x="336" y="218.4575">3</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167" x="349" y="218.4575">revokeConsent(customer)</text><polygon fill="#181818" points="541,261.6563,551,265.6563,541,269.6563" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="329" x2="547" y1="265.6563" y2="265.6563"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="9" x="336" y="260.5903">4</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187" x="349" y="260.5903">inform(revocation, customer)</text><rect fill="none" height="16.2969" id="_caption" style="stroke:none;stroke-width:1.0;" width="506" x="41.5" y="294.6563"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="506" x="41.5" y="307.6514">Sequence Diagram: The metered data administrator revokes the consent</text><!--MD5=[af3b1fcf9e3a22fa0993101f2f4368ec]
@startuml meter-data-admin-revokes-consent
'sequence diagram
caption Sequence Diagram: The metered data administrator revokes the consent

skinparam style strictuml
skinparam sequence {
  ParticipantBackgroundColor transparent
  ActorBackgroundColor transparent
}

autonumber
!pragma teoz true

box "Regional Data-sharing\nInfrastructure" #transparent
  participant "Metered Data\nAdministrator" as mda
end box
box "EDDIE Framework" #transparent
  box "Interoperable\nCommunication" #transparent
    participant "Regional\nConnector" as regionalConnector
  end box
end box
participant "Service" as service

mda -> mda : revokeConsent(\ncustomer, eligibleParty)
mda -> regionalConnector : inform(revocation, customer)
regionalConnector -> regionalConnector : revokeConsent(customer)
regionalConnector -> service : inform(revocation, customer)

@enduml

