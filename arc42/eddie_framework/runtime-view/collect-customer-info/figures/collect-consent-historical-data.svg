89" x="408" y="410.0903">requiredData)</text><line style="stroke:#181818;stroke-width:1.0;" x1="43" x2="53" y1="457.2891" y2="453.2891"/><line style="stroke:#181818;stroke-width:1.0;" x1="43" x2="53" y1="457.2891" y2="461.2891"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="42" x2="377" y1="457.2891" y2="457.2891"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="9" x="59" y="452.2231">9</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110" x="72" y="452.2231">show(redirection)</text><rect fill="none" height="16.2969" id="_caption" style="stroke:none;stroke-width:1.0;" width="413" x="56.5" y="486.2891"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="413" x="56.5" y="499.2842">Sequence Diagram: The customer fills out the consent form</text><!--MD5=[3fc5687bb7edcf930f6e31465b7605e2]
@startuml collect-consent-historical-data
'sequence diagram
caption Sequence Diagram: The customer fills out the consent form

skinparam style strictuml
skinparam sequence {
  ParticipantBackgroundColor transparent
  ActorBackgroundColor transparent
}

autonumber
!pragma teoz true

actor "Customer" as user
box "EDDIE Framework" #transparent
  participant "Permission\nFacade" as website
  box "Interoperable Communication\n"  #transparent
    box "\t\tRegional Connector\t\t"  #transparent
      participant "Microfrontend" as microfrontend
    end box
  end box
end box

user -> website : connect(\nhistoricalData)
activate website
  website - ->> user : show(popUp)
deactivate website

user -> website : select(country)
activate website
  website -> microfrontend : getMicrofrontend()
  activate microfrontend
    microfrontend - ->> website : microfrontend
  deactivate microfrontend
  website - ->> user : showForm(\nmicrofrontned)
deactivate website

user -> microfrontend : fillOutForm(requiredData)
activate microfrontend
  microfrontend -> microfrontend : requestConsent(\nrequiredData)
  microfrontend - ->> user : show(redirection)
deactivate microfrontend


@enduml

