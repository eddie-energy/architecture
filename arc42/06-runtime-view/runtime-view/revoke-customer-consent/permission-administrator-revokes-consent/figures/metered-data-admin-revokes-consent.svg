:#181818;stroke-width:1.0;" x1="284" x2="325" y1="236.5234" y2="236.5234"/><polygon fill="#181818" points="294,232.5234,284,236.5234,294,240.5234" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="9" x="290" y="218.4575">3</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167" x="303" y="218.4575">revokeConsent(customer)</text><polygon fill="#181818" points="495,261.6563,505,265.6563,495,269.6563" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="283" x2="501" y1="265.6563" y2="265.6563"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="9" x="290" y="260.5903">4</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187" x="303" y="260.5903">inform(revocation, customer)</text><rect fill="none" height="16.2969" id="_caption" style="stroke:none;stroke-width:1.0;" width="506" x="18.5" y="294.6563"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="506" x="18.5" y="307.6514">Sequence Diagram: The metered data administrator revokes the consent</text><!--MD5=[194a6e780222042a0eec88ae82e67fe7]
@startuml metered-data-admin-revokes-consent
'sequence diagram
caption Sequence Diagram: The metered data administrator revokes the consent

skinparam style strictuml
skinparam sequence {
  ParticipantBackgroundColor transparent
  ActorBackgroundColor transparent
}

autonumber
!pragma teoz true

participant "Metered Data\nAdministrator" as mda
box "EDDIE Framework" #transparent
  box "Interoperable\nCommunication" #transparent
    participant "Regional\nConnector" as regionalConnector
  end box
end box
participant "Service" as service

mda -> mda : revokeConsent(\ncustomer, eligibleParty)
mda -> regionalConnector : inform(revocation, customer)
regionalConnector -> regionalConnector : revokeConsent(customer)
regionalConnector -> service : inform(revocation, customer)

@enduml

