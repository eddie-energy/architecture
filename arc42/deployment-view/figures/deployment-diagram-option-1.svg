link adminConsole to database--><g id="link_adminConsole_database"><path d="M439,178.18 C439,196.61 439,219.05 439,237.88 " fill="none" id="adminConsole-database" style="stroke:#181818;stroke-width:1.0;"/></g><rect fill="none" height="16.2969" id="_caption" style="stroke:none;stroke-width:1.0;" width="301" x="114" y="362"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="301" x="114" y="374.9951">Deployment Diagram: Level 2 view, option 1</text><!--MD5=[a4bb3ff4b9ee740c9d1e4dcf411fa6d9]
@startuml deployment-diagram-option-1
'deployment diagram
caption Deployment Diagram: Level 2 view, option 1

skinparam linetype ortho
skinparam interface {
  backgroundColor transparent
  borderColor black
}
skinparam artifact{
  BorderColor black
  BackgroundColor transparent
}
skinparam component{
  BorderColor black
  BackgroundColor transparent
}
skinparam actor{
  BorderColor black
  BackgroundColor transparent
}
skinparam database{
  BorderColor black
  BackgroundColor transparent
}

rectangle "EDDIE Framework" {
  node "Docker Runtime" <<Local Computing Infrastructure>> as local {    
    artifact "Permission\nFacade" <<Container>> as consentFacade
    component "Interoperable\nCommunication" as comm
    artifact "Admin\nConsole" <<Container>> as adminConsole
    artifact "Streaming\nInfrastructure" <<Container>> as broker
    database "\tDatabase\t\n" <<Container>> as database
  }
}
  consentFacade -right- comm
  adminConsole -left- comm
  comm -down- broker
  comm -down- database
  adminConsole -down- database 
  
@enduml

