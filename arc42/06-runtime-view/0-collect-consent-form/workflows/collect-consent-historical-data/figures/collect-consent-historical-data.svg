 fill="#181818" points="408,453.2891,398,457.2891,408,461.2891" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="9" x="404" y="431.6567">9</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="107" x="417" y="424.0903">requestConsent(</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="89" x="417" y="439.2231">requiredData)</text><line style="stroke:#181818;stroke-width:1.0;" x1="43" x2="53" y1="486.4219" y2="482.4219"/><line style="stroke:#181818;stroke-width:1.0;" x1="43" x2="53" y1="486.4219" y2="490.4219"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="42" x2="386" y1="486.4219" y2="486.4219"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="18" x="59" y="481.356">10</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110" x="81" y="481.356">show(redirection)</text><rect fill="none" height="16.2969" id="_caption" style="stroke:none;stroke-width:1.0;" width="413" x="61" y="515.4219"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="413" x="61" y="528.417">Sequence Diagram: The customer fills out the consent form</text><!--MD5=[0cdc07fc15bc7f4183780f8ec7f0c881]
@startuml collect-consent-historical-data
'sequence diagram
caption Sequence Diagram: The customer fills out the consent form

skinparam style strictuml
skinparam sequence {
  ParticipantBackgroundColor transparent
  ActorBackgroundColor transparent
}

autonumber
!pragma teoz true

actor "Customer" as user
box "EDDIE Framework" #transparent
  participant "Permission\nFacade" as website
  box "Interoperable Communication\n"  #transparent
    box "\t\tRegional Connector\t\t"  #transparent
      participant "Microfrontend" as microfrontned
    end box
  end box
end box

user -> website : login(credentials)

user -> website : connect(\nhistoricalData)
activate website
  website - ->> user : show(popUp)
deactivate website

user -> website : select(country)
activate website
  website -> microfrontned : getMicrofrontend()
  activate microfrontned
    microfrontned - ->> website : microfrontend
  deactivate microfrontned
  website - ->> user : showForm(\nmicrofrontned)
deactivate website

user -> microfrontned : fillOutForm(requiredData)
activate microfrontned
  microfrontned -> microfrontned : requestConsent(\nrequiredData)
  microfrontned - ->> user : show(redirection)
deactivate microfrontned


@enduml

